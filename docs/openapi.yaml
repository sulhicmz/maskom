openapi: 3.0.3
info:
  title: Maskom API
  description: |
    Maskom Application API with resilient architecture featuring circuit breakers, 
    rate limiting, timeouts, and automatic retries.
    
    ## Features
    - **Resilience**: Circuit breakers, timeouts, exponential backoff retries
    - **Rate Limiting**: Per-endpoint rate limiting with configurable windows
    - **Monitoring**: Built-in metrics and health check endpoints
    - **Queue System**: Automatic queuing for failed operations
    - **Error Handling**: Standardized error responses with Retry-After headers
    
    ## Authentication
    Currently uses mock authentication. Production will use JWT tokens.
  version: 1.0.0
  contact:
    name: Maskom API Support
    email: support@maskom.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api
    description: Development server
  - url: https://maskom.com/api
    description: Production server

tags:
  - name: Health
    description: Health check and monitoring endpoints
  - name: Metrics
    description: Application metrics and performance data
  - name: Services
    description: Service status and management
  - name: Email
    description: Email service and queue management

paths:
  /health:
    get:
      tags:
        - Health
      summary: Get application health status
      description: |
        Returns health status for all services. Services are considered healthy 
        if their success rate meets or exceeds the threshold (default 90%).
        
        **Circuit Breaker**: Protected by circuit breaker (3 failures, 30s reset)
        **Timeout**: 5 second timeout
        **Retry**: 2 attempts with exponential backoff
      operationId: getHealth
      parameters:
        - name: threshold
          in: query
          description: Success rate threshold (0.0 - 1.0). Default: 0.9
          required: false
          schema:
            type: number
            minimum: 0.0
            maximum: 1.0
            default: 0.9
      responses:
        '200':
          description: All services are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: One or more services are degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '504':
          description: Health check request timed out
          headers:
            Retry-After:
              description: Seconds until retry is recommended
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              description: Seconds until rate limit resets
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /metrics:
    get:
      tags:
        - Metrics
      summary: Get application metrics
      description: |
        Returns performance metrics for all services including success rates, 
        failure counts, timeouts, and rate limit hits.
        
        **Circuit Breaker**: Protected by circuit breaker (3 failures, 30s reset)
        **Timeout**: 5 second timeout
        **Retry**: 2 attempts with exponential backoff
      operationId: getMetrics
      responses:
        '200':
          description: Metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '503':
          description: Service temporarily unavailable (circuit breaker open)
          headers:
            Retry-After:
              description: Seconds until retry is recommended
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Request timed out
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /services/status:
    get:
      tags:
        - Services
      summary: Get service status
      description: |
        Returns detailed status for EmailService and AuthService including 
        circuit breaker state, metrics, and health.
        
        **Circuit Breaker**: Protected by circuit breaker (3 failures, 30s reset)
        **Timeout**: 5 second timeout
        **Retry**: 2 attempts with exponential backoff
      operationId: getServicesStatus
      responses:
        '200':
          description: Service status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicesStatusResponse'
        '503':
          description: Service temporarily unavailable (circuit breaker open)
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Request timed out
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /email-queue:
    get:
      tags:
        - Email
      summary: Get email queue status
      description: |
        Returns current email queue status including size, expired emails, and circuit breaker state.
        
        **Circuit Breaker**: Protected by circuit breaker (3 failures, 30s reset)
        **Timeout**: 5 second timeout
        **Retry**: 2 attempts with exponential backoff
      operationId: getEmailQueueStatus
      responses:
        '200':
          description: Email queue status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailQueueStatusResponse'
        '503':
          description: Service temporarily unavailable (circuit breaker open)
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Request timed out
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Email
      summary: Process email queue
      description: |
        Processes all emails in the queue. Failed emails are retried up to 3 times 
        with exponential backoff. Emails that fail after max attempts are removed 
        from queue and counted as failed.
        
        **Circuit Breaker**: Protected by circuit breaker (3 failures, 30s reset)
        **Timeout**: 10 second timeout per email
        **Retry**: 3 attempts per email with exponential backoff (2s, 4s, 8s)
        **Rate Limiting**: Skipped for queue processor (higher priority)
      operationId: processEmailQueue
      responses:
        '200':
          description: Email queue processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailQueueProcessResponse'
        '503':
          description: Circuit breaker is open, cannot process queue
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Request timed out
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ServiceResult:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: Indicates if operation was successful
        message:
          type: string
          description: Human-readable message
        data:
          type: object
          description: Response data (present on success)
        error:
          type: string
          description: Error message (present on failure)
        errorCode:
          type: string
          description: Machine-readable error code
          enum:
            - VALIDATION_ERROR
            - RATE_LIMIT_EXCEEDED
            - TIMEOUT
            - CIRCUIT_BREAKER_OPEN
            - CREDENTIALS_MISSING
            - UNKNOWN_ERROR
            - NETWORK_ERROR
        metadata:
          type: object
          additionalProperties: true
          description: Additional metadata

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Human-readable error message
        errorCode:
          type: string
          description: Machine-readable error code
        metadata:
          type: object
          description: Additional error metadata

    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/ServiceResult'
        - type: object
          properties:
            data:
              type: object
              required:
                - status
                - timestamp
                - services
                - summary
              properties:
                status:
                  type: string
                  enum:
                    - healthy
                    - degraded
                  description: Overall system status
                timestamp:
                  type: string
                  format: date-time
                services:
                  type: array
                  items:
                    $ref: '#/components/schemas/HealthCheckResult'
                summary:
                  type: object
                  required:
                    - totalServices
                    - healthyServices
                    - unhealthyServices
                    - successRateThreshold
                  properties:
                    totalServices:
                      type: integer
                    healthyServices:
                      type: integer
                    unhealthyServices:
                      type: integer
                    successRateThreshold:
                      type: number

    HealthCheckResult:
      type: object
      required:
        - serviceName
        - healthy
        - message
        - metrics
        - checkedAt
      properties:
        serviceName:
          type: string
        healthy:
          type: boolean
        message:
          type: string
        metrics:
          $ref: '#/components/schemas/ServiceMetrics'
        checkedAt:
          type: integer
          description: Unix timestamp

    MetricsResponse:
      allOf:
        - $ref: '#/components/schemas/ServiceResult'
        - type: object
          properties:
            data:
              type: object
              required:
                - timestamp
                - summary
                - services
              properties:
                timestamp:
                  type: string
                  format: date-time
                summary:
                  type: object
                  required:
                    - totalServices
                    - totalCalls
                    - totalSuccesses
                    - totalFailures
                    - totalTimeouts
                    - totalRateLimits
                  properties:
                    totalServices:
                      type: integer
                    totalCalls:
                      type: integer
                    totalSuccesses:
                      type: integer
                    totalFailures:
                      type: integer
                    totalTimeouts:
                      type: integer
                    totalRateLimits:
                      type: integer
                services:
                  type: array
                  items:
                    $ref: '#/components/schemas/ServiceMetricsWithHealth'

    ServiceMetrics:
      type: object
      required:
        - serviceName
        - totalCalls
        - successCalls
        - failureCalls
        - timeoutCalls
        - rateLimitCalls
        - circuitBreakerOpenCount
      properties:
        serviceName:
          type: string
        totalCalls:
          type: integer
        successCalls:
          type: integer
        failureCalls:
          type: integer
        timeoutCalls:
          type: integer
        rateLimitCalls:
          type: integer
        circuitBreakerOpenCount:
          type: integer
        lastError:
          type: string
        lastSuccessTime:
          type: integer
          description: Unix timestamp
        lastFailureTime:
          type: integer
          description: Unix timestamp
        averageResponseTime:
          type: number
          description: Average response time in milliseconds

    ServiceMetricsWithHealth:
      allOf:
        - $ref: '#/components/schemas/ServiceMetrics'
        - type: object
          required:
            - successRate
            - health
          properties:
            successRate:
              type: number
              format: float
              description: Success rate as percentage (0-100)
            health:
              type: string
              enum:
                - healthy
                - degraded
                - unhealthy
              description: Service health status

    ServicesStatusResponse:
      allOf:
        - $ref: '#/components/schemas/ServiceResult'
        - type: object
          properties:
            data:
              type: object
              required:
                - timestamp
                - email
                - auth
              properties:
                timestamp:
                  type: string
                  format: date-time
                email:
                  type: object
                  required:
                    - metrics
                    - circuitBreaker
                  properties:
                    metrics:
                      $ref: '#/components/schemas/ServiceMetrics'
                    circuitBreaker:
                      $ref: '#/components/schemas/CircuitBreakerState'
                auth:
                  type: object
                  required:
                    - metrics
                    - circuitBreaker
                  properties:
                    metrics:
                      $ref: '#/components/schemas/ServiceMetrics'
                    circuitBreaker:
                      $ref: '#/components/schemas/CircuitBreakerState'

    CircuitBreakerState:
      type: object
      required:
        - isOpen
        - failureCount
        - lastFailureTime
        - lastSuccessTime
      properties:
        isOpen:
          type: boolean
          description: True if circuit breaker is open (blocking requests)
        failureCount:
          type: integer
          description: Number of consecutive failures
        lastFailureTime:
          type: integer
          nullable: true
          description: Unix timestamp of last failure
        lastSuccessTime:
          type: integer
          nullable: true
          description: Unix timestamp of last success

    EmailQueueStatusResponse:
      allOf:
        - $ref: '#/components/schemas/ServiceResult'
        - type: object
          properties:
            data:
              type: object
              required:
                - timestamp
                - queue
                - circuitBreaker
                - metrics
              properties:
                timestamp:
                  type: string
                  format: date-time
                queue:
                  type: object
                  required:
                    - size
                    - expired
                    - status
                  properties:
                    size:
                      type: integer
                      description: Number of emails in queue
                    expired:
                      type: integer
                      description: Number of expired emails in queue
                    status:
                      type: string
                      enum:
                        - has_pending_emails
                        - empty
                circuitBreaker:
                  $ref: '#/components/schemas/CircuitBreakerState'
                metrics:
                  $ref: '#/components/schemas/ServiceMetrics'

    EmailQueueProcessResponse:
      allOf:
        - $ref: '#/components/schemas/ServiceResult'
        - type: object
          properties:
            data:
              type: object
              required:
                - processed
                - failed
              properties:
                processed:
                  type: integer
                  description: Number of emails successfully processed
                failed:
                  type: integer
                  description: Number of emails that failed after max attempts

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT authentication token (currently mock, will use production JWT)

security:
  - BearerAuth: []

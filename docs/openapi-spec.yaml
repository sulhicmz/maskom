openapi: 3.0.3
info:
  title: Maskom API
  description: >
    Comprehensive API specification for Maskom external service integrations.
    
    ## Integration Architecture
    
    All external services follow a standardized resilience pattern:
    - Rate Limiting -> Timeout Protection -> Retry with Backoff -> Circuit Breaker -> External API
    
    ## Services
    
    - **Email Service**: Email sending via EmailJS
    - **Auth Service**: User authentication (mock implementation, ready for real backend)
    - **Monitoring Service**: Metrics collection and health checks
    
    ## Authentication
    
    Services use environment variables for credentials (EmailJS).
    Auth Service is currently in mock mode with ready-to-use interface.
    
    ## Error Codes
    
    All errors use standardized error codes: VALIDATION_ERROR, RATE_LIMIT_EXCEEDED, TIMEOUT, 
    CIRCUIT_BREAKER_OPEN, CREDENTIALS_MISSING, NETWORK_ERROR, UNKNOWN_ERROR
    
    ## Response Format
    
    All responses follow standard format:
    - Success: success=true, message=string, data=T
    - Error: success=false, error=string, errorCode=string, metadata=object
  
  version: 1.1.0
  contact:
    name: Maskom Development Team
    url: https://maskom.co.id
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://maskom.co.id/api
    description: Production server
  - url: http://localhost:3000/api
    description: Development server

tags:
  - name: Email
    description: Email sending operations
  - name: Authentication
    description: User authentication operations
  - name: Monitoring
    description: Metrics and health checks

paths:
  /email/send:
    post:
      tags:
        - Email
      summary: Send email
      description: >
        Sends an email using configured EmailJS template with built-in resilience patterns.
        
        **Resilience Configuration:**
        - Rate Limiting: 5 attempts per 60 seconds (per email)
        - Timeout: 10 seconds
        - Retry: 3 attempts with exponential backoff (1s, 2s)
        - Circuit Breaker: Opens after 5 consecutive failures, resets after 60 seconds
      operationId: sendEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailSendRequest'
            examples:
              valid:
                summary: Valid email request
                value:
                  templateParams:
                    user_name: "John Doe"
                    user_email: "john@example.com"
                    message: "Hello, I would like to inquire about your services."
                  skipRateLimit: false
      responses:
        '200':
          description: Email sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailSendResponse'
              example:
                success: true
                message: 'Email sent successfully'
                data:
                  text: 'OK'
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidEmail:
                  summary: Invalid email format
                  value:
                    success: false
                    error: 'Format email tidak valid'
                    errorCode: 'VALIDATION_ERROR'
                    metadata:
                      isRetryable: false
                      isTimeout: false
                missingFields:
                  summary: Missing required fields
                  value:
                    success: false
                    error: 'Email dan kata sandi diperlukan'
                    errorCode: 'VALIDATION_ERROR'
                    metadata:
                      isRetryable: false
                      isTimeout: false
                missingCredentials:
                  summary: Missing EmailJS credentials
                  value:
                    success: false
                    error: 'EmailJS credentials not configured'
                    errorCode: 'CREDENTIALS_MISSING'
                    metadata:
                      isRetryable: false
                      isTimeout: false
        '408':
          description: Request timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: 'EmailJS request timed out'
                errorCode: 'TIMEOUT'
                metadata:
                  isRetryable: true
                  isTimeout: true
        '429':
          description: Too many requests - rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: 'Too many attempts. Please try again in 30 seconds.'
                errorCode: 'RATE_LIMIT_EXCEEDED'
                metadata:
                  rateLimited: true
        '502':
          description: Bad gateway - retry exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: 'Email send failed after retries'
                errorCode: 'NETWORK_ERROR'
                metadata:
                  isRetryable: true
        '503':
          description: Service unavailable - circuit breaker open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: 'Circuit breaker is open. Service temporarily unavailable.'
                errorCode: 'CIRCUIT_BREAKER_OPEN'
                metadata:
                  isRetryable: false

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: >
        Authenticates a user with email and password.
        
        **Resilience Configuration:**
        - Rate Limiting: 5 attempts per 15 minutes (per email)
        - Timeout: 5 seconds
        - Retry: 3 attempts with exponential backoff
        - Circuit Breaker: Opens after 50 consecutive failures
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              valid:
                summary: Valid login request
                value:
                  email: "john@example.com"
                  password: "password123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                success: true
                message: 'Login berhasil'
                user:
                  id: 'user_johnexamplecom'
                  name: 'John Doe'
                  email: 'john@example.com'
                token: 'mock-jwt-token'
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidEmail:
                  summary: Invalid email format
                  value:
                    success: false
                    error: 'Format email tidak valid'
                    errorCode: 'VALIDATION_ERROR'
                    metadata:
                      isRetryable: false
                missingFields:
                  summary: Missing required fields
                  value:
                    success: false
                    error: 'Email dan kata sandi diperlukan'
                    errorCode: 'VALIDATION_ERROR'
        '429':
          description: Too many requests - rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: 'Terlalu banyak percobaan. Silakan coba lagi dalam 900 detik.'
                errorCode: 'RATE_LIMIT_EXCEEDED'
                metadata:
                  rateLimited: true
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: 'Terjadi kesalahan saat login'
                errorCode: 'UNKNOWN_ERROR'

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: >
        Registers a new user account.
        
        **Resilience Configuration:**
        - Rate Limiting: 5 attempts per 1 hour (per email)
        - Timeout: 5 seconds
        - Retry: 3 attempts with exponential backoff
        - Circuit Breaker: Opens after 50 consecutive failures
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              valid:
                summary: Valid registration request
                value:
                  name: "John Doe"
                  email: "john@example.com"
                  password: "password123"
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                success: true
                message: 'Registrasi berhasil'
                user:
                  id: 'user_johnexamplecom'
                  name: 'John Doe'
                  email: 'john@example.com'
                token: 'mock-jwt-token'
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidEmail:
                  summary: Invalid email format
                  value:
                    success: false
                    error: 'Format email tidak valid'
                    errorCode: 'VALIDATION_ERROR'
                    metadata:
                      isRetryable: false
                shortPassword:
                  summary: Password too short
                  value:
                    success: false
                    error: 'Kata sandi minimal 8 karakter'
                    errorCode: 'VALIDATION_ERROR'
                    metadata:
                      isRetryable: false
        '429':
          description: Too many requests - rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: 'Terlalu banyak percobaan. Silakan coba lagi dalam 3600 detik.'
                errorCode: 'RATE_LIMIT_EXCEEDED'
                metadata:
                  rateLimited: true
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: 'Terjadi kesalahan saat registrasi'
                errorCode: 'UNKNOWN_ERROR'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Clears current user session.
      operationId: logout
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              example:
                success: true
                message: 'Logout berhasil'

  /auth/current-user:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Retrieves currently authenticated user.
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                id: 'user_johnexamplecom'
                name: 'John Doe'
                email: 'john@example.com'
        '204':
          description: No user logged in

  /monitoring/metrics/{serviceName}:
    get:
      tags:
        - Monitoring
      summary: Get service metrics
      description: Retrieves metrics for a specific service.
      operationId: getServiceMetrics
      parameters:
        - name: serviceName
          in: path
          required: true
          schema:
            type: string
            enum: ['EmailService', 'AuthService.login', 'AuthService.register']
          description: Service name
      responses:
        '200':
          description: Metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceMetrics'
              example:
                serviceName: 'EmailService'
                totalCalls: 100
                successCalls: 95
                failureCalls: 5
                timeoutCalls: 2
                rateLimitCalls: 1
                circuitBreakerOpenCount: 0
                lastError: null
                lastSuccessTime: 1736697600000
                lastFailureTime: 1736697500000
                averageResponseTime: 1500
        '404':
          description: Service not found

  /monitoring/health/{serviceName}:
    get:
      tags:
        - Monitoring
      summary: Check service health
      description: Performs health check for a specific service with configurable success rate threshold.
      operationId: healthCheck
      parameters:
        - name: serviceName
          in: path
          required: true
          schema:
            type: string
            enum: ['EmailService', 'AuthService.login', 'AuthService.register']
          description: Service name
        - name: thresholdSuccessRate
          in: query
          required: false
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 1
            default: 0.8
          description: Success rate threshold (0-1)
      responses:
        '200':
          description: Health check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResult'
              examples:
                healthy:
                  summary: Service is healthy
                  value:
                    serviceName: 'EmailService'
                    healthy: true
                    message: 'Service is healthy (95.0% success rate)'
                    metrics:
                      serviceName: 'EmailService'
                      totalCalls: 100
                      successCalls: 95
                      failureCalls: 5
                      averageResponseTime: 1500
                    checkedAt: 1736697600000
                degraded:
                  summary: Service is degraded
                  value:
                    serviceName: 'EmailService'
                    healthy: false
                    message: 'Service is degraded (70.0% success rate, below threshold 80.0%)'
                    metrics:
                      serviceName: 'EmailService'
                      totalCalls: 100
                      successCalls: 70
                      failureCalls: 30
                      averageResponseTime: 2500
                    checkedAt: 1736697600000
        '404':
          description: Service not found

  /monitoring/metrics/all:
    get:
      tags:
        - Monitoring
      summary: Get all metrics
      description: Retrieves metrics for all services.
      operationId: getAllMetrics
      responses:
        '200':
          description: All metrics retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceMetrics'

  /monitoring/health/all:
    get:
      tags:
        - Monitoring
      summary: Check all services health
      description: Performs health check for all services with configurable success rate threshold.
      operationId: getAllHealthChecks
      parameters:
        - name: thresholdSuccessRate
          in: query
          required: false
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 1
            default: 0.8
          description: Success rate threshold (0-1)
      responses:
        '200':
          description: All health checks completed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HealthCheckResult'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authenticated requests

  schemas:
    EmailSendRequest:
      type: object
      required:
        - templateParams
      properties:
        templateParams:
          type: object
          required:
            - user_name
            - user_email
            - message
          properties:
            user_name:
              type: string
              description: Sender's name
              minLength: 1
              maxLength: 100
            user_email:
              type: string
              format: email
              description: Sender's email address
            message:
              type: string
              description: Email message content
              minLength: 1
              maxLength: 5000
        skipRateLimit:
          type: boolean
          description: Skip rate limit check (for admin use)
          default: false
        identifier:
          type: string
          description: Custom identifier for rate limiting (defaults to user_email)

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User's email address
        password:
          type: string
          format: password
          description: User's password
          minLength: 8

    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          description: User's full name
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          description: User's email address
        password:
          type: string
          format: password
          description: User's password
          minLength: 8

    EmailSendResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Email sent successfully'
        data:
          type: object
          properties:
            text:
              type: string
              description: EmailJS response text
              example: 'OK'

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Login berhasil'
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: Authentication token
          example: 'mock-jwt-token'

    LogoutResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Logout berhasil'

    UserResponse:
      $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          description: Generated user ID
          example: 'user_johnexamplecom'
        name:
          type: string
          description: User's display name
          example: 'John Doe'
        email:
          type: string
          format: email
          description: User's email address
          example: 'john@example.com'

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Human-readable error message (non-sensitive)
        errorCode:
          type: string
          enum:
            - VALIDATION_ERROR
            - RATE_LIMIT_EXCEEDED
            - TIMEOUT
            - CIRCUIT_BREAKER_OPEN
            - CREDENTIALS_MISSING
            - NETWORK_ERROR
            - UNKNOWN_ERROR
        metadata:
          type: object
          description: Additional error metadata
          properties:
            isRetryable:
              type: boolean
              description: Whether error is retryable
            isTimeout:
              type: boolean
              description: Whether error is a timeout
            rateLimited:
              type: boolean
              description: Whether request was rate limited

    ServiceMetrics:
      type: object
      properties:
        serviceName:
          type: string
          example: 'EmailService'
        totalCalls:
          type: integer
          description: Total API calls
          example: 100
        successCalls:
          type: integer
          description: Successful calls
          example: 95
        failureCalls:
          type: integer
          description: Failed calls
          example: 5
        timeoutCalls:
          type: integer
          description: Timeout errors
          example: 2
        rateLimitCalls:
          type: integer
          description: Rate limit errors
          example: 1
        circuitBreakerOpenCount:
          type: integer
          description: Circuit breaker opens
          example: 0
        lastError:
          type: string
          nullable: true
          description: Last error message
          example: 'EmailJS request timed out'
        lastSuccessTime:
          type: integer
          format: int64
          description: Last success timestamp (Unix epoch)
          example: 1736697600000
        lastFailureTime:
          type: integer
          format: int64
          description: Last failure timestamp (Unix epoch)
          example: 1736697500000
        averageResponseTime:
          type: number
          format: float
          description: Average response time in milliseconds
          example: 1500

    HealthCheckResult:
      type: object
      properties:
        serviceName:
          type: string
          example: 'EmailService'
        healthy:
          type: boolean
          description: Health status
          example: true
        message:
          type: string
          description: Health message
          example: 'Service is healthy (95.0% success rate)'
        metrics:
          $ref: '#/components/schemas/ServiceMetrics'
        checkedAt:
          type: integer
          format: int64
          description: Check timestamp (Unix epoch)
          example: 1736697600000
